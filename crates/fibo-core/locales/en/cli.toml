# Command usage table (`control.rs`, `themes_cmd.rs`, `plugins_run.rs`)
"fibo list [--json]                         终端列表：要你处理的排前面，状态、Agent、标签、目录、编号" = "fibo list [--json]                         List terminals (attention needed first: status, agent, tab, cwd, ID)"
"fibo read <终端> [--lines N]               画面最后 N 行（默认 50）" = "fibo read <terminal> [--lines N]           Read the last N visible screen lines (default 50)"
"fibo send <终端> <文字|-> [--enter]        把文字作为粘贴放进终端；- 从标准输入读（最多 64 KiB）" = "fibo send <terminal> <text|-> [--enter]    Paste text into a terminal; - reads stdin (up to 64 KiB)"
"fibo prompt <终端> <文字|-> [--wait] [--timeout 秒] [--force]\n                                             给 Agent 发一条并回车；它正等你回答时拒绝，除非 --force" = "fibo prompt <terminal> <text|-> [--wait] [--timeout SECS] [--force]\n                                             Send a prompt to an Agent and submit; refuses while waiting for approval unless --force"
"fibo wait <终端> [--until idle|waiting|working] [--timeout 秒]\n                                             等 Agent 进入某个状态（默认 idle：这一轮做完）" = "fibo wait <terminal> [--until idle|waiting|working] [--timeout SECS]\n                                             Wait for an Agent to enter a phase (default idle: turn finished)"
"fibo explain --file <画面.txt> --agent <claude|codex> [--json]\nfibo explain <终端> [--json]               画面规则怎么读这块屏：状态、命中的规则、规则版本和来源、看到的行；\n                                             还有每个后台 shell 算任务还是服务、依据哪条" = "fibo explain --file <screen.txt> --agent <claude|codex> [--json]\nfibo explain <terminal> [--json]           Explain how screen rules classify this pane (state, matched rule, rule source, visible lines,\n                                             and whether each background shell counts as a job or service)"
"fibo events [--json]                       先列出现在的状态，再每有变化输出一行，直到 Ctrl-C：\n                                             started / waiting / error / done、approval / approval_gone、\n                                             terminal_started / terminal_exited、command_done / command_failed；\n                                             lagged 表示跟不上丢了事件，应重新开一次取现状" = "fibo events [--json]                       Emit current snapshot then stream one line per state change until Ctrl-C:\n                                             started / waiting / error / done, approval / approval_gone,\n                                             terminal_started / terminal_exited, command_done / command_failed;\n                                             lagged means events were dropped and a fresh snapshot should be taken"
"fibo split <终端> [--down] [--size 0.5] [--tab|--here] [--cwd 目录] [--json] [-- 命令…]\n                                             在这个终端右边（--down 下面）开一块新分屏，打印新终端编号；\n                                             标签已有 4 块或切开太窄时开到「旁屏」标签（--here 改为拒绝，\n                                             --tab 直接开到旁屏）；给了命令就在新 shell 里跑，跑完留在 shell" = "fibo split <terminal> [--down] [--size 0.5] [--tab|--here] [--cwd DIR] [--json] [-- <cmd>...]\n                                             Open a split to the right (--down below) and print the new terminal ID;\n                                             overflows to a side tab past 4 panes or narrow width (--here refuses instead,\n                                             --tab always opens a side tab); optional command runs in the new shell and stays open"
"fibo run <agent> <任务|-> [--split] [--cwd 目录] [--no-report] [--from <终端>] [--timeout 秒] [--json]\n                                             派一个 Agent 去做事：开在旁屏标签（--split 开在旁边），等它出现输入框\n                                             再交任务；它每结束一轮，结果自动发回你的输入框（<fibo from=…>）；\n                                             不在 Fibo 终端里时用 --from 说开在谁旁边、汇报给谁" = "fibo run <agent> <task|-> [--split] [--cwd DIR] [--no-report] [--from <terminal>] [--timeout SECS] [--json]\n                                             Delegate a task to an Agent in a side tab (--split opens beside you), wait for its input box,\n                                             and submit; when each turn ends, results report back (<fibo from=...>);\n                                             outside a Fibo terminal, pass --from to pick the anchor and recipient"
"fibo close <终端>                          关掉这块分屏并结束里面的程序" = "fibo close <terminal>                      Close a pane and terminate its running process"
"fibo todo list [--all] [--json]            没做完的待办；--all 连已收尾的\nfibo todo show [--task <待办>] [--json]      看一条：用户写的、验收标准、进展\nfibo todo add <标题|-> [--said <原话>] [--space <空间>] [--work] [--json]\n                                           记一件事，默认只记下来自哪个会话；--work 表示这个会话就在做它\nfibo todo note <文字|-> [--task <待办>]      写进展：做了什么、剩什么、要用户定什么；完成由用户标记" = "fibo todo list [--all] [--json]            List open todos; --all includes completed ones\nfibo todo show [--task <todo>] [--json]      Show a todo: user prompt, acceptance criteria, and progress notes\nfibo todo add <title|-> [--said <quote>] [--space <space>] [--work] [--json]\n                                           Record a todo from this session; --work links this session as actively working on it\nfibo todo note <text|-> [--task <todo>]      Append progress: what is done, what remains, and decisions needed; users mark completion"
"fibo themes [文件或目录]                 按 App 的规则检查主题：跳过了什么、图在不在、对比度够不够\nfibo themes names                       列出主题能写的全部键" = "fibo themes [file-or-dir]                Validate themes with App rules: skipped keys, missing images, and contrast checks\nfibo themes names                       List every supported theme key"
"fibo plugins [--dir 目录] [--json]         检查插件能不能装上：哪个生效、哪个为什么没生效\nfibo plugins available [--remote]          列出可安装的插件（App 附带的，加 --remote 再查远程目录）\nfibo plugins install <id>[@版本] [--remote] [--yes]\n                                             安装或更新一个插件；会跑命令的要确认，非交互时加 --yes\nfibo plugins uninstall <id> [--force]      卸载一个插件；--force 在 teardown 失败时也卸\nfibo plugins disable|enable <id> [--force]\n                                             停用或打开一个插件；--force 在 teardown 失败时也停用\nfibo plugins log <id>                      这个插件最近的运行和出过的错\nfibo plugins set <id> [<key> <值>]         看或改插件的设置项\nfibo plugins run <id> <声明 id> [--event 事件] [--cwd 目录] [--send]\n                                             用和 App 一样的环境试跑一条 hook、装饰或额度命令；webhook 加 --send 才真发\nfibo plugins index <目录> [--check] [--key 私钥文件]\n                                             为插件目录生成 index.json 并签名（--check 只检查是否最新、签名对不对）\nfibo plugins keygen [--name 发布者] [--key 私钥文件]\n                                             生成发布者的签名私钥，默认 <配置>/publisher.key" = "fibo plugins [--dir DIR] [--json]          Validate installed plugins: what loaded and why anything was skipped\nfibo plugins available [--remote]          List installable plugins (bundled, plus remote catalog with --remote)\nfibo plugins install <id>[@ver] [--remote] [--yes]\n                                             Install or update a plugin; pass --yes to confirm command-running plugins non-interactively\nfibo plugins uninstall <id> [--force]      Uninstall a plugin; --force removes even if teardown fails\nfibo plugins disable|enable <id> [--force]\n                                             Disable or enable a plugin; --force disables even if teardown fails\nfibo plugins log <id>                      Show recent runs and errors for a plugin\nfibo plugins set <id> [<key> <value>]      Inspect or update plugin settings\nfibo plugins run <id> <decl-id> [--event EVENT] [--cwd DIR] [--send]\n                                             Dry-run a hook, decoration, or quota command as the App does; webhooks require --send to post\nfibo plugins index <dir> [--check] [--key KEYFILE]\n                                             Generate and sign index.json for a plugin catalog (--check verifies freshness and signature)\nfibo plugins keygen [--name PUBLISHER] [--key KEYFILE]\n                                             Generate an Ed25519 publisher signing key (default <config>/publisher.key)"
"fibo remote --stdio [--role view|answer|full]     给另一台机器或手机 App 用：一行一个 JSON 请求和回复（看画面、打字、按键、\n                                             答审批、事件），经 ssh 连过来：ssh 主机 fibo remote --stdio\nfibo remote --relay <中继地址> [--relay-key <密钥>] [--report]\n                                             连上中继并一直挂着，配对过的手机在哪都能连过来；内容端到端加密，\n                                             中继看不到。中继要密钥时也可以设 MOORING_RELAY_KEY；\n                                             --report 把连接状态报给后台（后台自己启动它时用）\nfibo remote --pair --relay <中继地址> [--name 名字] [--role view|answer|full] [--new-code]\n                                             配对一台新手机，打印它的二维码和链接；权限分只看 / 能答审批 / 完全控制（默认）。\n                                             加 --new-code 换掉机器码，已配对的手机全部失效\nfibo remote --enable --relay <中继地址> [--relay-key <密钥>] | --disable\n                                             让后台一直挂在中继上（重启后也会自动连回去），或者断开；配对保留\nfibo remote --status [--json]              中继连接状态、配对的手机、现在谁在线、在看哪个终端\nfibo remote --kick <设备>                  立刻断开这台手机正连着的会话，配对保留\nfibo remote --devices                      列出配对过的手机、权限和最近连接时间；操作记在运行目录的 remote-log.jsonl\nfibo remote --device <设备> --role <view|answer|full>\n                                             改一台手机的权限；它正连着的会话一秒内断开，重连后按新权限\nfibo remote --revoke <设备编号或名字>      取消一台手机的配对，它正连着的会话一秒内断开\nfibo remote --machine-name <名字>          手机上这台电脑叫什么；给空字符串换回系统主机名，手机重连后显示新名字" = "fibo remote --stdio [--role view|answer|full]     JSON-over-stdio transport for another Mac or phone app over SSH:\n                                             ssh <host> fibo remote --stdio\nfibo remote --relay <url> [--relay-key <key>] [--report]\n                                             Stay connected to a relay with end-to-end encryption for paired phones;\n                                             also reads MOORING_RELAY_KEY; --report reports connection state to the host\nfibo remote --pair --relay <url> [--name NAME] [--role view|answer|full] [--new-code]\n                                             Pair a phone and print its QR code and link; --new-code rotates the machine code\nfibo remote --enable --relay <url> [--relay-key <key>] | --disable\n                                             Keep the host connected to a relay across restarts, or disconnect while keeping pairings\nfibo remote --status [--json]              Show relay status, paired phones, who is online, and watched terminals\nfibo remote --kick <device>                Disconnect a device's active session immediately without revoking pairing\nfibo remote --devices                      List paired devices, roles, and last-seen times (audit log in remote-log.jsonl)\nfibo remote --device <device> --role <view|answer|full>\n                                             Change a paired device's role (active session reconnects with new permissions)\nfibo remote --revoke <id-or-name>          Revoke a paired device and disconnect its active session\nfibo remote --machine-name <name>          Set this Mac's display name on paired phones (empty string resets to hostname)"
"fibo hooks install|uninstall [--agent <cli>]\n                                             把 Fibo 的 hook 写进（或移出）Agent CLI 自己的设置；不写 --agent 就是全部\nfibo hooks status [--agent <cli>] [--json] [--outdated-only]\n                                             各 CLI 的 hook 装了没有、和现在 install 会写的差在哪" = "fibo hooks install|uninstall [--agent <cli>]\n                                             Install or remove Fibo hooks in Agent CLI settings (all agents when --agent is omitted)\nfibo hooks status [--agent <cli>] [--json] [--outdated-only]\n                                             Check hook installation status and drift against current Fibo hooks"
"fibo hook --agent <claude|codex|grok>      Agent CLI 的 hook 调用的入口：从标准输入读一条 hook JSON（最多 1 MiB）\n                                             报给后台；不在 Fibo 终端里什么都不做。不用手动跑" = "fibo hook --agent <claude|codex|grok>      Hook callback entry point invoked by Agent CLIs: reads one hook JSON (up to 1 MiB)\n                                             from stdin and reports to the host; no-op outside Fibo terminals"
"fibo serve --runtime <目录> [--takeover] [--recent-days N]\n                                             启动后台（App 自己会启动，不用手动跑）；--takeover 从正在跑的后台\n                                             接过全部终端，--recent-days 只读最近 N 天的会话（默认 7）" = "fibo serve --runtime <dir> [--takeover] [--recent-days N]\n                                             Start the background host (started automatically by the App); --takeover adopts live terminals,\n                                             --recent-days limits session history scan to N days (default 7)"
"fibo socket                                打印后台的 socket 路径；另一台电脑的窗口经 ssh 连这台时用" = "fibo socket                                Print this host's socket path; another machine's window forwards to it over ssh"
"fibo scan --runtime <目录>                 让后台重新扫一遍 Agent 会话，打印会话数和终端数" = "fibo scan --runtime <dir>                  Rescan Agent sessions and print session and terminal counts"
"fibo --skill                               给 Coding Agent 看的用法说明（Markdown）\nfibo --skill plugins                       给 Coding Agent 看的写插件、改外观说明（Markdown）\nfibo --skill session                       Fibo 在会话开始时告诉 Agent 的话" = "fibo --skill                               Print the Markdown guide for coding agents driving Fibo\nfibo --skill plugins                       Print the Markdown guide for authoring Fibo plugins and themes\nfibo --skill session                       Print the brief session-start note injected for coding agents"
"fibo --version                             打印协议版本" = "fibo --version                             Print protocol version"
"<终端> 可以是编号的前几位或标签名；全部命令都接受 --runtime <目录>；-h / --help 只打印用法、什么都不做。\nAgent 藏在包装器（沙盒、虚拟机、nono 等）后面认不出时，启动前设 MOORING_AGENT=<claude|codex|…>。" = "<terminal> accepts a unique ID prefix or tab title; every command accepts --runtime <dir>; -h / --help prints usage without side effects.\nWhen an Agent runs behind a wrapper (sandbox, VM, nono, etc.), set MOORING_AGENT=<claude|codex|...> before launching."

