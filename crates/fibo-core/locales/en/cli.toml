"用法：fibo plugins [--dir 插件目录] [--json]\n      fibo plugins available [--remote]      列出可安装的插件（App 附带的，加 --remote 再查远程目录）\n      fibo plugins install <id>[@版本] [--remote] [--yes]\n                                              安装或更新一个插件；会跑命令的要确认，非交互时加 --yes\n      fibo plugins uninstall <id> [--force]\n                                              卸载一个插件；--force 在 teardown 失败时也卸（加载不了的按目录名卸）\n      fibo plugins disable|enable <id> [--force]\n                                              停用或打开一个插件；--force 在 teardown 失败时也停用\n      fibo plugins index <目录> [--check] [--key 私钥文件]\n                                              为插件目录生成 index.json 并用私钥签名（--check 只检查是否最新、签名对不对）\n      fibo plugins keygen [--name 发布者] [--key 私钥文件]\n                                              生成发布者的签名私钥，默认 <配置>/publisher.key\n      fibo plugins log <id>                   这个插件最近的运行：setup、hook、出过错的装饰和额度命令\n      fibo plugins set <id> [<key> <值>]      看或改插件的设置项；值写 true/false、数字或文字\n      fibo plugins run <id> <声明 id> [--event 事件] [--cwd 目录]\n                                              用和 App 一样的环境试跑一条 hook、装饰或额度命令，打印输出；\n                                              webhook 只显示会发什么，加 --send 才真发\n\n检查插件能不能装上：逐个读 plugin.json 和它提供的文件，说哪个生效、哪个为什么没生效。\n默认目录是 ${XDG_CONFIG_HOME:-$HOME/.config}/fibo/plugins。有问题时以 1 退出。\n手写改了插件目录后，在 Fibo 的 设置 › 插件 点「重新读取」就生效。\n写插件的说明：fibo --skill plugins" = "Usage: fibo plugins [--dir DIR] [--json]\n       fibo plugins available [--remote]      List installable plugins (bundled, plus remote catalog with --remote)\n       fibo plugins install <id>[@ver] [--remote] [--yes]\n                                               Install or update a plugin; pass --yes to confirm command-running plugins\n       fibo plugins uninstall <id> [--force]\n                                               Uninstall a plugin; --force removes even if teardown fails\n       fibo plugins disable|enable <id> [--force]\n                                               Disable or enable a plugin; --force disables even if teardown fails\n       fibo plugins index <dir> [--check] [--key KEYFILE]\n                                               Generate and sign index.json for a plugin catalog (--check verifies only)\n       fibo plugins keygen [--name PUBLISHER] [--key KEYFILE]\n                                               Generate an Ed25519 publisher signing key (default <config>/publisher.key)\n       fibo plugins log <id>                   Show recent runs: setup, hooks, and failing decoration or quota commands\n       fibo plugins set <id> [<key> <value>]   Inspect or update plugin settings (true/false, number, or string)\n       fibo plugins run <id> <decl-id> [--event EVENT] [--cwd DIR]\n                                               Dry-run a hook, decoration, or quota command in the App environment;\n                                               webhooks only preview payload unless --send is passed\n\nValidates each plugin's plugin.json and provided files, reporting what loaded and why anything was skipped.\nDefault directory: ${XDG_CONFIG_HOME:-$HOME/.config}/fibo/plugins. Exits 1 on validation errors.\nAfter editing plugins manually, click \"Reload\" in Fibo Settings > Plugins.\nAuthoring guide: fibo --skill plugins"
