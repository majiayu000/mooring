# crates/fibo-app/src/workbench/first_run.rs: the welcome page on a first start.
"欢迎使用 Fibo" = "Welcome to Fibo"
"每个 Agent 都跑在这里的真终端里。在这里启动 Claude Code 或 Codex，左边就会列出这个会话和它现在的状态：{running}、{waiting}、{review}。" = "Every agent runs in a real terminal here. Start Claude Code or Codex and the sidebar lists the session and its state: {running}, {waiting}, {review}."
"启动一个 Agent" = "Start an agent"
"在 {place} 打开；换文件夹用左边空间旁的 ＋" = "Opens in {place}; to use another folder, click + beside the spaces on the left"
"不再显示" = "Don't show again"
"启动 {name}" = "Start {name}"
"没在登录 shell 的 PATH 里找到 {executable}。安装：{hint}" = "{executable} isn't on your login shell's PATH. Install: {hint}"
"正在查找…" = "Looking…"
"正在检查…" = "Checking…"
"没能检查：{e}" = "Couldn't check: {e}"
"推荐装上：{agents} 的状态和审批就不靠猜画面。会在 {files} 里加几条 Fibo 的条目，只在 Fibo 的终端里起作用，在别处什么都不做。以后安装或卸载：设置 › 通用，或在 Fibo 终端里运行 fibo hooks install / uninstall。" = "Recommended: then {agents} report state and approvals directly instead of Fibo reading the screen. Adds a few Fibo entries to {files} that only act in Fibo terminals and do nothing elsewhere. To install or remove them later: Settings › General, or run fibo hooks install / uninstall in a Fibo terminal."
"已安装" = "Installed"
"读不了 {file}：{why}" = "Can't read {file}: {why}"
"正在安装…" = "Installing…"
"启动 {agents} 时一起装上（推荐）" = "Install with the first start of {agents} (recommended)"
"、" = ", "
"；" = "; "

# crates/fibo-app/src/workbench/hooks.rs: the status bar's hook reminder and the welcome page's install.
"Hook 没装上，Agent 照常启动：{e}" = "Couldn't install the hooks; the agent starts anyway: {e}"
"{name} 的 Hook 过期了" = "{name} hooks are outdated"
"{name} 没装 Hook" = "{name} has no hooks"
"没有 Hook，它的状态和审批只能靠读终端画面来判断" = "Without hooks, Fibo can only read the terminal screen to tell its state and approvals"
"点开 设置 › 通用 安装；这条提醒也在那里关" = "Click for Settings › General to install them; this reminder is switched off there too"
"安装或卸载 Agent 的 Hook" = "Install or remove agent hooks"
