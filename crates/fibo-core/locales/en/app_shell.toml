"在 {host} 上找不到 Fibo 的后台：{why}" = "Can't find Fibo's host on {host}: {why}"
"空间、待办和会话结局沿用现有对象表，不作迁移；重启会中断正在运行的终端。本窗口不会重启后台或删除数据。" = "Spaces, to-dos, and session outcomes reuse the existing tables without migration; restarting will interrupt running terminals. This window will not restart the host or delete data."
