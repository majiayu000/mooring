[package]
name = "mooring-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "Mooring workbench host"
license = "MIT"

[[bin]]
name = "mooring"
path = "src/main.rs"

[dependencies]
regex = "1"
zstd = "0.13"
memchr = "2"
shlex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
mooring-core = { path = "../mooring-core" }
mooring-platform = { path = "../mooring-platform" }
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
libc.workspace = true
# `mooring remote` carries terminal bytes inside JSON lines.
base64 = "0.22"
serde.workspace = true
# `mooring remote --relay`: this machine on a relay, for phones anywhere.
mooring-remote = { path = "../mooring-remote" }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# Not named in the code: picks ring as tokio-tungstenite's TLS provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
qrcode = { version = "0.14", default-features = false }
# Hook installs rewrite the CLI's own settings file; its keys keep their order.
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
mooring-relay = { path = "../mooring-relay" }
rusqlite = { version = "0.38", features = ["hooks"] }
